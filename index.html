<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dino Ascension</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#182719;font:14px system-ui;color:#eef8ea}canvas{position:fixed;inset:0}#hud{position:fixed;z-index:2;left:14px;top:14px;width:270px;padding:13px;background:#071215e8;border:1px solid #597565;border-radius:13px}.title{font-size:19px;font-weight:900;margin-bottom:8px}.r{display:flex;justify-content:space-between;margin:5px 0;font-size:13px}.bar{height:8px;background:#26373a;border-radius:9px;overflow:hidden;margin:4px 0 8px}.fill{height:100%}.xp{background:#8ddd55}.hp{background:#e96b65}#skillsBtn{position:fixed;z-index:2;right:14px;top:14px;padding:10px 14px;border:1px solid #72975b;border-radius:10px;background:#29451f;color:#f0f8e9;font-weight:800}#hint{position:fixed;z-index:2;left:14px;bottom:14px;padding:9px 12px;background:#071215e8;border:1px solid #597565;border-radius:10px;color:#bfd0c5;font-size:12px}#toast{position:fixed;z-index:5;left:50%;bottom:64px;transform:translateX(-50%);padding:10px 15px;background:#14251d;border:1px solid #698677;border-radius:10px;display:none}.ov{position:fixed;z-index:4;inset:0;background:#020808c9;display:none}.panel{position:absolute;inset:5vh 4vw;background:#102027;border:1px solid #5a7567;border-radius:18px;overflow:auto}.head{display:flex;justify-content:space-between;padding:14px 18px;position:sticky;top:0;background:#102027eF;border-bottom:1px solid #40594e}.head h2{margin:0}.close{background:#16271f;color:#fff;border:1px solid #617466;border-radius:8px;padding:8px 11px}.tree{position:relative;width:1050px;height:650px;margin:auto}.node{position:absolute;width:125px;min-height:76px;padding:9px;border-radius:12px;border:1px solid #5c7667;background:#152821;cursor:pointer}.node.lock{opacity:.42}.node.on{border-color:#a8e56e;background:#294229}.edge{position:absolute;height:3px;background:#46604f;transform-origin:0 50%}</style></head><body><canvas id="g"></canvas><div id="hud"><div class="title">🦖 Dino Ascension</div><div class="r"><span>Species</span><b id="spc">Raptorian</b></div><div class="r"><span>Level</span><b id="lv">1</b></div><div class="r"><span>XP</span><b id="xt">0 / 80</b></div><div class="bar"><div id="xb" class="fill xp" style="width:0"></div></div><div class="r"><span>Health</span><b id="ht">120 / 120</b></div><div class="bar"><div id="hb" class="fill hp" style="width:100%"></div></div><div class="r"><span>Growth</span><b id="sz">1.00×</b></div><div class="r"><span>Skill points</span><b id="pts">0</b></div><div class="r"><span>Kills</span><b id="ki">0</b></div><div class="r"><span>Position</span><b id="po">4500, 4500</b></div><div class="r"><span>Target</span><b id="tg">None</b></div><b id="danger" style="display:none;color:#ffaaaa">⚠ Apex predator nearby</b></div><button id="skillsBtn">🌿 Skill Tree (K)</button><div id="hint">WASD / arrows = move • Space = bite • K = skills • Esc = close</div><div id="toast"></div><div id="overlay" class="ov"><div class="panel"><div class="head"><div><h2>🌿 Evolution Skill Tree</h2><small>Spend skill points to evolve.</small></div><button class="close" id="close">Close</button></div><div id="tree" class="tree"></div></div></div><script>
const c=document.getElementById('g'),x=c.getContext('2d'),W=()=>innerWidth,H=()=>innerHeight;function rs(){c.width=W()*devicePixelRatio;c.height=H()*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',rs);rs();
const Z=9000,K={};addEventListener('keydown',e=>{K[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='k')overlay.style.display='block';if(e.key==='Escape')overlay.style.display='none';if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault()});addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);
const R=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function H(x,y){let n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)}
const me={x:4500,y:4500,r:28,spd:285,lvl:1,xp:0,next:80,pts:0,max:120,hp:120,dmg:22,crit:.06,sense:450,grow:1,kills:0,armor:0,regen:0,mult:1,cd:0,species:'Raptorian'};
const T=[['Compsognathus',11,'#8bb79e',18,18,160,0],['Dryosaurus',16,'#80b76e',30,28,140,0],['Psittacosaurus',20,'#c9a45d',44,40,125,1],['Oviraptor',23,'#b7788b',55,52,132,1],['Young Hadrosaur',32,'#6b91a5',90,82,100,2]],P=[];for(let i=0;i<75;i++){let t=Math.random()<.07?T[4]:T[(Math.random()*4)|0];P.push({t,x:cl(4500+R(-1900,1900),100,Z-100),y:cl(4500+R(-1900,1900),100,Z-100),hp:t[3],max:t[3],dir:R(0,6.28),w:R(.5,3),hurt:0})}
const boss={x:7600,y:2200,r:105,hp:1600,max:1600,alive:1};const ponds=[],rocks=[];for(let i=0;i<42;i++)ponds.push({x:R(120,Z-120),y:R(120,Z-120),rx:R(70,230),ry:R(50,150)});for(let i=0;i<210;i++)rocks.push({x:R(80,Z-80),y:R(80,Z-80),r:R(7,25)});
const plants=[];for(let gx=0;gx<Z;gx+=120)for(let gy=0;gy<Z;gy+=120){if(H(gx,gy)>.43)plants.push({x:gx+H(gy,gx)*110,y:gy+H(gy+8,gx+4)*110})}
const S=[['bite','Bigger Bite','+7 damage',1,60,500,[],()=>me.dmg+=7],['bones','Dense Bones','+20 max HP',1,60,350,[],()=>{me.max+=20;me.hp+=20}],['scent','Keen Scent','+120 sense',1,60,200,[],()=>me.sense+=120],['stride','Long Stride','+40 speed',1,260,500,['bite'],()=>me.spd+=40],['ferocity','Ferocity','+14 damage',2,440,500,['stride'],()=>me.dmg+=14],['ambush','Ambush','+10% crit',2,620,410,['ferocity'],()=>me.crit+=.1],['reflex','Predator Reflexes','-0.09s bite cooldown',2,800,410,['ambush'],()=>me.cd=Math.min(me.cd,.28)],['hide','Thick Hide','+25% armor',2,440,290,['bones'],()=>me.armor+=.25],['regen','Rapid Healing','+2 HP/sec',2,620,290,['hide'],()=>me.regen+=2],['jaw','Iron Jaw','+25 damage',3,800,290,['regen'],()=>me.dmg+=25],['met','Metabolism','better recovery',2,260,180,['scent'],()=>{}],['apex','Apex Hunter','+30% XP',3,440,140,['met'],()=>me.mult+=.3],['giant','Colossal Growth','+40% size',4,620,140,['apex'],()=>{me.grow+=.4;me.r*=1.4;me.max+=55;me.hp+=55}],['prime','Primeval Apex','+60 dmg +180 HP',6,800,140,['giant','jaw'],()=>{me.dmg+=60;me.max+=180;me.hp+=180;me.species='Primeval Apex'}]];const got=new Set();
function tree(){const t=document.getElementById('tree'),m=Object.fromEntries(S.map(a=>[a[0],a]));t.innerHTML='';for(const q of S)for(const id of q[6]){const a=m[id],e=document.createElement('i');e.className='edge';let ax=a[4]+62,ay=a[5]+40,bx=q[4]+62,by=q[5]+40;e.style.left=ax+'px';e.style.top=ay+'px';e.style.width=Math.hypot(bx-ax,by-ay)+'px';e.style.transform='rotate('+Math.atan2(by-ay,bx-ax)+'rad)';t.appendChild(e)}for(const a of S){const n=document.createElement('div');n.className='node';n.id='n'+a[0];n.style.left=a[4]+'px';n.style.top=a[5]+'px';n.innerHTML='<b>'+a[1]+'</b><div style="font-size:10px;color:#b9c9bf;margin-top:4px">'+a[2]+'</div><small style="color:#f0cb68">✦ '+a[3]+' SP</small>';n.onclick=()=>buy(a[0]);t.appendChild(n)}}tree();function refresh(){S.forEach(a=>{const n=document.getElementById('n'+a[0]),ok=a[6].every(q=>got.has(q));n.classList.toggle('lock',!ok||got.has(a[0]));n.classList.toggle('on',got.has(a[0]))})}refresh();function buy(id){const a=S.find(q=>q[0]===id);if(got.has(id)||!a)return;if(!a[6].every(q=>got.has(q))){toast('Unlock its prerequisite first');return}if(me.pts<a[3]){toast('Not enough skill points');return}me.pts-=a[3];got.add(id);a[7]();refresh();hud();toast(a[1]+' unlocked!')}
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',1700)}function gain(v){me.xp+=Math.round(v*me.mult);while(me.xp>=me.next){me.xp-=me.next;me.lvl++;me.pts++;me.next=Math.round(me.next*1.25+20);me.max+=7;me.hp=Math.min(me.max,me.hp+25);me.dmg+=2;me.grow+=.035;me.r*=1.035;toast('LEVEL UP! You grew larger.')}}function tar(){let b=null,d=me.sense;for(const p of P){let q=D(me,p);if(q<d){d=q;b=p}}return b}function bite(){if(me.cd>0)return;let p=tar();if(p&&D(me,p)<me.r+p.t[1]+85){me.cd=.38;let z=me.dmg*(Math.random()<me.crit?2.2:1);p.hp-=z;p.hurt=.14;if(p.hp<=0){P.splice(P.indexOf(p),1);me.kills++;gain(p.t[4]);toast('Hunt successful • +'+Math.round(p.t[4]*me.mult)+' XP')}}else if(boss.alive&&D(me,boss)<me.r+boss.r+85){me.cd=.42;boss.hp-=me.dmg*(Math.random()<me.crit?2:1);if(boss.hp<=0){boss.alive=0;gain(1500);me.pts+=4;toast('APEX DEFEATED • +4 SP')}}}
function upd(dt){me.cd=Math.max(0,me.cd-dt);if(me.regen)me.hp=Math.min(me.max,me.hp+me.regen*dt);let a=(K.d||K.arrowright?1:0)-(K.a||K.arrowleft?1:0),b=(K.s||K.arrowdown?1:0)-(K.w||K.arrowup?1:0),q=Math.hypot(a,b)||1;me.x=cl(me.x+a/q*me.spd*dt,50,Z-50);me.y=cl(me.y+b/q*me.spd*dt,50,Z-50);if(K[' ']){K[' ']=0;bite()}for(const p of P){p.w-=dt;let d=D(me,p);if(d<190){let q=Math.atan2(p.y-me.y,p.x-me.x);p.x+=Math.cos(q)*p.t[5]*dt;p.y+=Math.sin(q)*p.t[5]*dt}else{if(p.w<=0){p.w=R(1,3);p.dir=R(0,6.28)}p.x+=Math.cos(p.dir)*p.t[5]*.25*dt;p.y+=Math.sin(p.dir)*p.t[5]*.25*dt}p.x=cl(p.x,40,Z-40);p.y=cl(p.y,40,Z-40);p.hurt=Math.max(0,p.hurt-dt)}if(boss.alive&&D(me,boss)<900){let q=Math.atan2(me.y-boss.y,me.x-boss.x);boss.x=cl(boss.x+Math.cos(q)*110*dt,100,Z-100);boss.y=cl(boss.y+Math.sin(q)*110*dt,100,Z-100);if(D(me,boss)<me.r+boss.r+12)me.hp=Math.max(0,me.hp-25*dt)}if(me.hp<=0){me.hp=me.max*.7;me.x=4500;me.y=4500;me.xp=Math.max(0,me.xp-25);toast('You recovered at the nest')}while(P.length<65){let t=T[(Math.random()*4)|0];P.push({t,x:R(100,Z-100),y:R(100,Z-100),hp:t[3],max:t[3],dir:R(0,6.28),w:R(1,3),hurt:0})}hud()}
function dino(px,py,r,col,kind,flip){x.save();x.translate(px,py);x.scale(flip,1);x.lineJoin='round';x.strokeStyle='#1a241d';x.lineWidth=Math.max(2,r*.08);x.fillStyle=col;x.beginPath();x.ellipse(0,r*.04,r*1.2,r*.58,0,0,7);x.fill();x.stroke();x.beginPath();x.moveTo(-r*.78,0);x.quadraticCurveTo(-r*1.7,-r*.15,-r*2.0,-r*.7);x.lineTo(-r*1.65,0);x.quadraticCurveTo(-r*1.2,r*.28,-r*.7,r*.25);x.fill();x.stroke();x.beginPath();x.ellipse(r*.72,-r*.29,r*.5,r*.38,0,0,7);x.fill();x.stroke();x.fillStyle='#1b211a';x.beginPath();x.arc(r*.94,-r*.4,Math.max(2,r*.075),0,7);x.fill();x.fillStyle='#f3ead7';for(let i=0;i<3;i++){x.beginPath();x.moveTo(r*(.98+i*.06),-r*.12);x.lineTo(r*(1.04+i*.06),-r*.03);x.lineTo(r*(1.09+i*.06),-r*.12);x.fill()}x.strokeStyle='#26362a';x.lineWidth=Math.max(2,r*.12);for(const lx of [-r*.3,r*.3]){x.beginPath();x.moveTo(lx,r*.42);x.lineTo(lx-r*.08,r*1.02);x.stroke()}x.fillStyle='rgba(255,255,255,.13)';x.beginPath();x.ellipse(-r*.25,-r*.16,r*.65,r*.15,0,0,7);x.fill();if(kind===2){x.fillStyle='#6e8750';x.beginPath();x.moveTo(r*.18,-r*.55);x.quadraticCurveTo(r*.68,-r*1.15,r*1.0,-r*.5);x.lineTo(r*.6,-r*.3);x.fill()}else{x.fillStyle='#637f4b';for(let i=0;i<4;i++){x.beginPath();x.moveTo(-r*.1-i*r*.2,-r*.5);x.lineTo(r*(.02-i*.2),-r*(.95-i*.08));x.lineTo(r*(.13-i*.2),-r*.53);x.fill()}}x.restore()}
function draw(){let cx=me.x,cy=me.y;x.fillStyle='#557d51';x.fillRect(0,0,W(),H());const tile=140;for(let gx=Math.floor((cx-W()/2)/tile)*tile-140;gx<cx+W()/2+140;gx+=tile)for(let gy=Math.floor((cy-H()/2)/tile)*tile-140;gy<cy+H()/2+140;gy+=tile){let h=H(gx/140,gy/140);x.fillStyle=h>.72?'#5b8354':h<.17?'#4a724b':'#527a4f';x.fillRect(gx-cx+W()/2,gy-cy+H()/2,tile+1,tile+1)}for(const p of ponds){let px=p.x-cx+W()/2,py=p.y-cy+H()/2;if(px<-p.rx||px>W()+p.rx||py<-p.ry||py>H()+p.ry)continue;x.fillStyle='#3f707a';x.beginPath();x.ellipse(px,py,p.rx,p.ry,.12,0,7);x.fill()}for(const r of rocks){let px=r.x-cx+W()/2,py=r.y-cy+H()/2;if(px<-30||px>W()+30||py<-30||py>H()+30)continue;x.fillStyle='#566059';x.beginPath();x.ellipse(px,py,r.r,r.r*.68,.15,0,7);x.fill()}for(const p of plants){let px=p.x-cx+W()/2,py=p.y-cy+H()/2;if(px<-20||px>W()+20||py<-30||py>H()+30)continue;x.strokeStyle='#2b5634';x.lineWidth=3;x.beginPath();x.moveTo(px,py+8);x.lineTo(px,py-9);x.stroke();x.fillStyle='#3d7443';for(let j=-1;j<2;j++){x.beginPath();x.arc(px+j*6,py-9-Math.abs(j)*3,7,0,7);x.fill()}}for(const p of P){let px=p.x-cx+W()/2,py=p.y-cy+H()/2;if(px<-100||px>W()+100||py<-100||py>H()+100)continue;dino(px,py,p.t[1],p.hurt?'#f5eee2':p.t[2],p.t[6],p.x<me.x?-1:1)}if(boss.alive){let px=boss.x-cx+W()/2,py=boss.y-cy+H()/2;if(px>-160&&px<W()+160&&py>-160&&py<H()+160){dino(px,py,boss.r,'#4e394d',1,boss.x<me.x?-1:1);x.fillStyle='#ffd0d0';x.font='bold 13px system-ui';x.textAlign='center';x.fillText('APEX PREDATOR',px,py-boss.r-22);x.fillStyle='#31191f';x.fillRect(px-80,py-boss.r-14,160,7);x.fillStyle='#dd6268';x.fillRect(px-80,py-boss.r-14,160*boss.hp/boss.max,7)}}dino(W()/2,H()/2,me.r,'#8eae67',1,1);x.strokeStyle='#f3ffe733';x.beginPath();x.arc(W()/2,H()/2,me.r+95,0,7);x.stroke()}
function hud(){lv.textContent=me.lvl;xt.textContent=me.xp+' / '+me.next;xb.style.width=100*me.xp/me.next+'%';ht.textContent=Math.round(me.hp)+' / '+Math.round(me.max);hb.style.width=100*me.hp/me.max+'%';sz.textContent=me.grow.toFixed(2)+'×';pts.textContent=me.pts;ki.textContent=me.kills;po.textContent=Math.round(me.x)+', '+Math.round(me.y);spc.textContent=me.species;let p=tar();tg.textContent=p?p.t[0]:'None';danger.style.display=boss.alive&&D(me,boss)<850?'block':'none'}let last=performance.now();function loop(n){let dt=Math.min(.035,(n-last)/1000);last=n;upd(dt);draw();requestAnimationFrame(loop)}hud();requestAnimationFrame(loop);
</script></body></html>
