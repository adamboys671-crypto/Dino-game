<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dino Ascension</title>
<style>
:root{--panel:rgba(7,16,20,.9);--line:#577465;--text:#edf7e9;--muted:#b5c7bc;--accent:#9ddd5e;--gold:#f0c963}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081116;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#hud{position:fixed;left:16px;top:16px;z-index:5;min-width:270px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 35px #0005}.title{font-weight:900;font-size:18px;margin-bottom:8px}.row{display:flex;justify-content:space-between;gap:20px;font-size:13px;margin:4px 0}.bar{height:9px;border-radius:99px;overflow:hidden;background:#233038;margin:5px 0 9px}.fill{height:100%;width:50%;transition:width .15s}.xp{background:#8bd953}.hp{background:#e66d65}
#help{position:fixed;left:16px;bottom:16px;z-index:5;padding:9px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:12px}#skillBtn{position:fixed;right:16px;top:16px;z-index:5;border:1px solid #759f56;background:#28411f;color:#e9f7df;padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer}
#skillOverlay{position:fixed;inset:0;z-index:20;display:none;background:#02080acc;backdrop-filter:blur(5px)}#skills{position:absolute;inset:5vh 4vw;background:rgba(15,30,36,.96);border:1px solid #557363;border-radius:18px;overflow:hidden;display:flex;flex-direction:column}#skillHeader{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid #3c554a}#skillHeader h2{margin:0;font-size:22px}#close{border:1px solid #617568;background:#17261f;color:#eaf5ed;border-radius:8px;padding:8px 11px;cursor:pointer}
#skillViewport{position:relative;flex:1;overflow:auto;background:radial-gradient(circle at 30% 20%,#708f5f14,transparent 30%),linear-gradient(#0e1d22,#0b171b)}#skillCanvas{position:relative;width:1050px;height:680px;margin:0 auto}.line{position:absolute;height:3px;background:#47604f;transform-origin:left center;border-radius:3px;opacity:.85}.node{position:absolute;width:124px;min-height:82px;border:1px solid #5c7466;background:#13231e;border-radius:13px;padding:8px;cursor:pointer;box-shadow:0 8px 18px #0003}.node:hover{border-color:#94c87c}.node.locked{opacity:.45;cursor:not-allowed}.node.active{border-color:var(--accent);background:#243b25}.node .n{font-weight:800;font-size:13px}.node .d{font-size:10px;color:#b8c9bd;line-height:1.2;margin-top:4px}.node .cost{font-size:10px;color:var(--gold);margin-top:5px}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:30;background:#17251f;border:1px solid #648373;padding:9px 14px;border-radius:10px;display:none;box-shadow:0 10px 30px #0008}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="title">🦖 Dino Ascension</div><div class="row"><span>Species</span><b id="species">Raptorian</b></div><div class="row"><span>Level</span><b id="level">1</b></div><div class="row"><span>XP</span><b id="xp">0 / 80</b></div><div class="bar"><div id="xpFill" class="fill xp"></div></div><div class="row"><span>Health</span><b id="hp">100 / 100</b></div><div class="bar"><div id="hpFill" class="fill hp"></div></div><div class="row"><span>Growth</span><b id="size">1.00×</b></div><div class="row"><span>Skill points</span><b id="sp">0</b></div><div class="row"><span>World</span><b id="world">0, 0</b></div><div class="row"><span>Target</span><b id="target">None</b></div><div id="bossText" style="display:none;margin-top:6px;color:#ffadad;font-weight:800">⚠️ Apex predator nearby</div></div>
<button id="skillBtn">🌿 Skill Tree (K)</button>
<div id="help">WASD / Arrow keys = move • Space = bite/hunt • K = skills • Esc = close</div><div id="toast"></div>
<div id="skillOverlay"><div id="skills"><div id="skillHeader"><div><h2>🌿 Evolution Skill Tree</h2><div style="font-size:12px;color:#a9beb2">Spend skill points from leveling. Green nodes are unlocked.</div></div><button id="close">Close</button></div><div id="skillViewport"><div id="skillCanvas"></div></div></div></div>
<script>
"use strict";
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');const W=()=>innerWidth,H=()=>innerHeight;function resize(){canvas.width=W()*devicePixelRatio;canvas.height=H()*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
const WORLD=9000,keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key.toLowerCase()==='k')toggleSkills(true);if(e.key==='Escape')toggleSkills(false)});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const rnd=(a,b)=>Math.random()*(b-a)+a,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),pick=a=>a[(Math.random()*a.length)|0];let seed=13;function noise(x,y){const s=Math.sin(x*12.9898+y*78.233+seed)*43758.5453;return s-Math.floor(s)}
const player={x:WORLD/2,y:WORLD/2,speed:270,baseSpeed:270,radius:24,level:1,xp:0,xpNext:80,sp:0,maxHp:100,hp:100,damage:18,armor:0,attackCd:0,attackRange:100,growth:1,hunger:100,kills:0,species:'Raptorian',regen:0,sense:380,crit:.05,xpMult:1};
const preyTypes=[{name:'Compsognathus',color:'#8cb6a0',r:11,hp:18,damage:2,speed:150,xp:18},{name:'Dryosaurus',color:'#7db66e',r:15,hp:28,damage:4,speed:135,xp:26},{name:'Psittacosaurus',color:'#c5a65e',r:18,hp:40,damage:5,speed:120,xp:36},{name:'Oviraptor',color:'#b87587',r:20,hp:48,damage:7,speed:130,xp:46},{name:'Young Hadrosaur',color:'#6a8aa0',r:29,hp:82,damage:10,speed:96,xp:75}],prey=[];
function spawnPrey(){while(prey.length<70){const a=Math.random()*Math.PI*2,d=rnd(400,WORLD*.44);let x=clamp(player.x+Math.cos(a)*d,150,WORLD-150),y=clamp(player.y+Math.sin(a)*d,150,WORLD-150),t=pick(preyTypes);if(t===preyTypes[4]&&Math.random()>.08)t=pick(preyTypes.slice(0,4));prey.push({...t,x,y,vx:0,vy:0,dir:Math.random()*Math.PI*2,wander:rnd(.5,3),hurt:0})}}spawnPrey();
const apex={x:WORLD*.78,y:WORLD*.28,r:95,hp:1200,maxHp:1200,speed:100,damage:34,alive:true};const ponds=[],rocks=[];for(let i=0;i<45;i++)ponds.push({x:rnd(100,WORLD-100),y:rnd(100,WORLD-100),rx:rnd(70,220),ry:rnd(50,150)});for(let i=0;i<170;i++)rocks.push({x:rnd(50,WORLD-50),y:rnd(50,WORLD-50),r:rnd(7,26)});
const skills=[{id:'muscle',name:'Bigger Bite',desc:'+6 damage',cost:1,x:80,y:500,req:[],effect:()=>player.damage+=6},{id:'bone',name:'Dense Bones',desc:'+15 max HP',cost:1,x:80,y:350,req:[],effect:()=>{player.maxHp+=15;player.hp+=15}},{id:'scent',name:'Keen Scent',desc:'+80 prey sense',cost:1,x:80,y:200,req:[],effect:()=>player.sense+=80},{id:'legs',name:'Long Stride',desc:'+35 move speed',cost:1,x:260,y:500,req:['muscle'],effect:()=>{player.baseSpeed+=35;player.speed=player.baseSpeed}},{id:'ferocity',name:'Ferocity',desc:'+10 damage',cost:2,x:430,y:500,req:['legs'],effect:()=>player.damage+=10},{id:'ambush',name:'Ambush',desc:'+8% critical chance',cost:2,x:600,y:400,req:['ferocity'],effect:()=>player.crit+=.08},{id:'raptor',name:'Raptor Reflexes',desc:'faster attacks',cost:2,x:770,y:400,req:['ambush'],effect:()=>player.attackCooldownBonus=(player.attackCooldownBonus||0)+.04},{id:'thickhide',name:'Thick Hide',desc:'+25% armor',cost:2,x:430,y:275,req:['bone'],effect:()=>player.armor+=.25},{id:'renewal',name:'Rapid Healing',desc:'+2 HP/sec',cost:2,x:600,y:250,req:['thickhide'],effect:()=>player.regen+=2},{id:'ironjaw',name:'Iron Jaw',desc:'+20 damage',cost:3,x:770,y:250,req:['renewal'],effect:()=>player.damage+=20},{id:'metabolism',name:'Metabolism',desc:'More effective hunting',cost:2,x:260,y:175,req:['scent'],effect:()=>player.hunger=100},{id:'predator',name:'Apex Hunter',desc:'+25% XP gain',cost:3,x:430,y:125,req:['metabolism'],effect:()=>player.xpMult+=.25},{id:'giant',name:'Colossal Growth',desc:'+35% body size',cost:4,x:600,y:125,req:['predator'],effect:()=>{player.growth+=.35;player.radius*=1.35;player.maxHp+=40;player.hp+=40}},{id:'final',name:'Primeval Apex',desc:'+50 dmg, +150 HP',cost:6,x:800,y:125,req:['giant','ironjaw'],effect:()=>{player.damage+=50;player.maxHp+=150;player.hp+=150;player.species='Primeval Apex'}}],unlocked=new Set();
function addLine(parent,a,b){const el=document.createElement('div');el.className='line';const dx=b.x+62-(a.x+62),dy=b.y+41-(a.y+41),len=Math.hypot(dx,dy),ang=Math.atan2(dy,dx);el.style.left=a.x+62+'px';el.style.top=a.y+41+'px';el.style.width=len+'px';el.style.transform=`rotate(${ang}rad)`;parent.appendChild(el)}
function buildSkills(){const root=document.getElementById('skillCanvas');root.innerHTML='';const by=Object.fromEntries(skills.map(s=>[s.id,s]));for(const s of skills)for(const r of s.req)if(by[r])addLine(root,by[r],s);for(const s of skills){const n=document.createElement('div');n.className='node';n.style.left=s.x+'px';n.style.top=s.y+'px';n.id='node-'+s.id;n.innerHTML=`<div class="n">${s.name}</div><div class="d">${s.desc}</div><div class="cost">✦ ${s.cost} SP</div>`;n.onclick=()=>buySkill(s.id);root.appendChild(n)}refreshSkillNodes()}function refreshSkillNodes(){for(const s of skills){const n=document.getElementById('node-'+s.id);if(!n)continue;const reqOK=s.req.every(r=>unlocked.has(r));n.classList.toggle('active',unlocked.has(s.id));n.classList.toggle('locked',!reqOK||unlocked.has(s.id))}}function buySkill(id){const s=skills.find(v=>v.id===id);if(!s||unlocked.has(id))return;if(!s.req.every(r=>unlocked.has(r))){toast('That evolution requires another node first.');return}if(player.sp<s.cost){toast('Not enough skill points.');return}player.sp-=s.cost;unlocked.add(id);s.effect();toast(s.name+' unlocked!');refreshSkillNodes();updateHud()}function toggleSkills(open){document.getElementById('skillOverlay').style.display=open?'block':'none';if(open)refreshSkillNodes()}document.getElementById('skillBtn').onclick=()=>toggleSkills(true);document.getElementById('close').onclick=()=>toggleSkills(false);buildSkills();
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>el.style.display='none',1800)}
function gainXP(n){player.xp+=Math.round(n*player.xpMult);while(player.xp>=player.xpNext){player.xp-=player.xpNext;player.level++;player.sp++;player.xpNext=Math.round(player.xpNext*1.24+25);player.maxHp+=5;player.hp=Math.min(player.maxHp,player.hp+18);player.damage+=2;player.growth+=.035;player.radius*=1.035;toast('LEVEL UP! You grew stronger.')}}
function nearestPrey(maxD=player.sense){let best=null,bd=maxD;for(const p of prey){const d=dist(player,p);if(d<bd){bd=d;best=p}}return best}
function attack(t){if(player.attackCd>0)return;player.attackCd=Math.max(.18,.42-(player.attackCooldownBonus||0));const dmg=player.damage*(Math.random()<player.crit?2.2:1);t.hp-=dmg;t.hurt=.15;if(t.hp<=0){const i=prey.indexOf(t);if(i>=0)prey.splice(i,1);player.kills++;player.hunger=clamp(player.hunger+30,0,100);gainXP(t.xp);toast('Hunt successful: +'+Math.round(t.xp*player.xpMult)+' XP')}}function attackApex(){if(!apex.alive||player.attackCd>0)return;if(dist(player,apex)<player.attackRange+apex.r){player.attackCd=.46-(player.attackCooldownBonus||0);apex.hp-=player.damage*(Math.random()<player.crit?2:1);if(apex.hp<=0){apex.alive=false;gainXP(1200);player.sp+=4;toast('APEX DEFEATED! Huge evolution reward.')}}}
function update(dt){player.attackCd=Math.max(0,player.attackCd-dt);player.hunger=clamp(player.hunger-dt*.5,0,100);if(player.regen>0)player.hp=clamp(player.hp+player.regen*dt,0,player.maxHp);if(player.hunger<10)player.hp=clamp(player.hp-dt*1.1,0,player.maxHp);let ax=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),ay=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),mag=Math.hypot(ax,ay)||1;ax/=mag;ay/=mag;player.x=clamp(player.x+ax*player.speed*dt,50,WORLD-50);player.y=clamp(player.y+ay*player.speed*dt,50,WORLD-50);const t=nearestPrey();if(keys[' ']){if(t&&dist(player,t)<player.attackRange+t.r)attack(t);else if(apex.alive&&dist(player,apex)<player.attackRange+apex.r)attackApex()}for(const p of prey){p.wander-=dt;const d=dist(p,player);if(d<180){const a=Math.atan2(p.y-player.y,p.x-player.x);p.vx=Math.cos(a)*p.speed;p.vy=Math.sin(a)*p.speed}else{if(p.wander<=0){p.wander=rnd(.6,2.4);p.dir=rnd(0,Math.PI*2)}p.vx=Math.cos(p.dir)*p.speed*.35;p.vy=Math.sin(p.dir)*p.speed*.35}p.x=clamp(p.x+p.vx*dt,40,WORLD-40);p.y=clamp(p.y+p.vy*dt,40,WORLD-40);p.hurt=Math.max(0,p.hurt-dt);if(d<player.radius+p.r+4&&Math.random()<.04)player.hp=clamp(player.hp-p.damage*(1-player.armor)*dt,0,player.maxHp)}if(apex.alive){const d=dist(apex,player);if(d<850){const a=Math.atan2(player.y-apex.y,player.x-apex.x);apex.x=clamp(apex.x+Math.cos(a)*apex.speed*dt,100,WORLD-100);apex.y=clamp(apex.y+Math.sin(a)*apex.speed*dt,100,WORLD-100);if(d<apex.r+player.radius+10)player.hp=clamp(player.hp-apex.damage*(1-player.armor)*dt,0,player.maxHp)}}if(player.hp<=0){player.hp=player.maxHp*.65;player.x=WORLD/2;player.y=WORLD/2;player.xp=Math.max(0,player.xp-20);toast('Your dinosaur recovered at its nest.')}if(prey.length<55)spawnPrey();updateHud()}
function drawDino(x,y,r,color){ctx.save();ctx.translate(x,y);ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(0,2,r*1.25,r*.72,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(r*.75,-r*.28,r*.57,r*.45,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle=color;ctx.lineWidth=Math.max(3,r*.17);ctx.beginPath();ctx.moveTo(-r*.82,2);ctx.lineTo(-r*1.65,-r*.32);ctx.stroke();ctx.beginPath();ctx.moveTo(-r*.25,r*.45);ctx.lineTo(-r*.45,r*1.05);ctx.moveTo(r*.25,r*.48);ctx.lineTo(r*.45,r*1.05);ctx.stroke();ctx.fillStyle='#171b1a';ctx.beginPath();ctx.arc(r*1.02,-r*.42,Math.max(2,r*.09),0,Math.PI*2);ctx.fill();ctx.restore()}
function drawWorld(camX,camY){ctx.fillStyle='#4e7953';ctx.fillRect(0,0,W(),H());const tile=140;for(let sx=Math.floor((camX-W()/2)/tile)*tile-100;sx<camX+W()/2+100;sx+=tile){for(let sy=Math.floor((camY-H()/2)/tile)*tile-100;sy<camY+H()/2+100;sy+=tile){const n=noise(sx*.005,sy*.005);ctx.fillStyle=n>.66?'#57845a':n<.29?'#4a7350':'#527b54';ctx.fillRect(sx-camX+W()/2,sy-camY+H()/2,tile+2,tile+2)}}for(const p of ponds){const x=p.x-camX+W()/2,y=p.y-camY+H()/2;if(x<-p.rx||x>W()+p.rx||y<-p.ry||y>H()+p.ry)continue;ctx.save();ctx.translate(x,y);ctx.scale(1,.75);ctx.fillStyle='#406d77';ctx.beginPath();ctx.ellipse(0,0,p.rx,p.ry,0,0,Math.PI*2);ctx.fill();ctx.restore()}for(const r of rocks){const x=r.x-camX+W()/2,y=r.y-camY+H()/2;if(x<-30||x>W()+30||y<-30||y>H()+30)continue;ctx.fillStyle='#56625b';ctx.beginPath();ctx.arc(x,y,r.r,0,Math.PI*2);ctx.fill()}for(let i=0;i<140;i++){const wx=Math.floor((camX-W()/2)/110)*110+i*83%((W()+220)),wy=Math.floor((camY-H()/2)/100)*100+(i*57)%(H()+220),n=noise(wx*.011,wy*.011),x=wx-camX+W()/2,y=wy-camY+H()/2;if(x<-30||x>W()+30||y<-50||y>H()+50||n<.5)continue;ctx.strokeStyle='#31543b';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,y+14);ctx.lineTo(x,y-18);ctx.stroke();ctx.fillStyle='#315e3c';ctx.beginPath();ctx.arc(x-7,y-18,11,0,Math.PI*2);ctx.arc(x+8,y-16,12,0,Math.PI*2);ctx.arc(x,y-28,13,0,Math.PI*2);ctx.fill()}}
function draw(){const camX=player.x,camY=player.y;drawWorld(camX,camY);if(apex.alive){const x=apex.x-camX+W()/2,y=apex.y-camY+H()/2;if(x>-150&&x<W()+150&&y>-150&&y<H()+150){drawDino(x,y,apex.r,'#4d374e');ctx.fillStyle='#f2c2c2';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText('APEX',x,y-apex.r-20);ctx.fillStyle='#301b22';ctx.fillRect(x-75,y-apex.r-12,150,7);ctx.fillStyle='#d75b61';ctx.fillRect(x-75,y-apex.r-12,150*(apex.hp/apex.maxHp),7)}}for(const p of prey){const x=p.x-camX+W()/2,y=p.y-camY+H()/2;if(x<-80||x>W()+80||y<-80||y>H()+80)continue;drawDino(x,y,p.r,p.hurt?'#f4ece1':p.color)}drawDino(W()/2,H()/2,player.radius,'#8eac67');ctx.strokeStyle='#f5ffe633';ctx.beginPath();ctx.arc(W()/2,H()/2,player.attackRange,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#0009';ctx.fillRect(W()-190,H()-70,174,52);ctx.fillStyle='#e6f3e3';ctx.font='12px system-ui';ctx.textAlign='left';ctx.fillText('WILDERNESS SECTOR',W()-176,H()-48);ctx.fillText(Math.round(player.x)+' E   '+Math.round(player.y)+' N',W()-176,H()-29)}
function updateHud(){level.textContent=player.level;xp.textContent=`${player.xp} / ${player.xpNext}`;xpFill.style.width=clamp(player.xp/player.xpNext*100,0,100)+'%';hp.textContent=`${Math.round(player.hp)} / ${Math.round(player.maxHp)}`;hpFill.style.width=clamp(player.hp/player.maxHp*100,0,100)+'%';size.textContent=player.growth.toFixed(2)+'×';sp.textContent=player.sp;species.textContent=player.species;world.textContent=`${Math.round(player.x)}, ${Math.round(player.y)}`;const t=nearestPrey();target.textContent=t?t.name:'None';bossText.style.display=apex.alive&&dist(player,apex)<850?'block':'none'}
let last=performance.now();function loop(now){const dt=Math.min(.035,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}updateHud();requestAnimationFrame(loop);
</script>
</body>
</html>
